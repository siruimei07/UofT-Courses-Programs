name: CI
# Pull requests are validated here; pushes to main are validated by the Pages workflow.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: npm ci
      - run: pip install -r requirements.txt
      - run: npm run test:py
      - name: Frontend data is regenerated from the backend dataset
        run: npm run data:build -- --check
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
